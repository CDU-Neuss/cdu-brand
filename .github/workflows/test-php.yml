# Description:
# Runs the Pest test suite for Blade and Twig template rendering
# Runs on pull requests and pushes to the main branch

# GITHUB SECRETS REQUIRED: NONE

name: Test (Pest)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Pest) — PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]

    steps:
      - name: Checkout project repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install Composer dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run Pest tests
        run: vendor/bin/pest
